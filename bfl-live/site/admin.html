<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Coach Panel · Built For Life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E3242B'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='900' font-size='36' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/admin.css">
<link rel="manifest" href="manifest-coach.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BFL Coach">
</head>
<body>

<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <span class="mark">B</span>
    <h1>Coach panel</h1>
    <p>Built For Life</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="PIN" aria-label="PIN">
    <button class="btn red" type="submit">Enter</button>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="hint">Demo PIN: 1234</p>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="brand" href="index.html" target="_blank" rel="noopener"><span class="mark sm">B</span><span>BUILT <em>FOR</em> LIFE</span></a>
    <nav class="side-nav" id="sideNav">
      <button data-view="dashboard" class="on"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>Dashboard</button>
      <button data-view="diary"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 12h3v3H8z"/></svg>Diary<span class="badge" id="todayBadge" hidden></span></button>
      <button data-view="training"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Training</button>
      <button data-view="checkins"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>Check-ins<span class="badge" id="ciBadge" hidden></span></button>
      <button data-view="risk"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19zM12 10v4.5M12 17.2v.3"/></svg>At risk<span class="badge" id="riskBadge" hidden></span></button>
      <button data-view="messages"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></svg>Messages<span class="badge" id="msgBadge" hidden></span></button>
      <button data-view="community"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19c.7-3.3 3-5 6-5s5.3 1.7 6 5M15 14.5c2.6 0 4.5 1.4 5.2 4.2"/></svg>Community</button>
      <button data-view="leads"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.5 3.6 5.4"/></svg>Sign-ups<span class="badge" id="newBadge" hidden></span></button>
      <button data-view="payments"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 10h18M7 15h4"/></svg>Payments<span class="badge" id="payBadge" hidden></span></button>
      <button data-view="pipeline"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v5h-4z"/></svg>Pipeline</button>
      <button data-view="clients"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Clients</button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
    </nav>
    <div class="side-foot"><a href="portal.html" target="_blank" rel="noopener">Open client portal ↗</a><a href="transform.html" target="_blank" rel="noopener">Open questionnaire ↗</a><a href="index.html" target="_blank" rel="noopener">View website ↗</a><button id="logout" type="button">Log out</button></div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn menu-t" id="menuT" aria-label="Menu">☰</button>
      <div><p class="top-date" id="topDate"></p><h1 id="viewTitle">Dashboard</h1></div>
      <button class="bell" id="bell" type="button" aria-label="Notifications" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg><i id="bellN" hidden></i></button>
      <span class="demo-pill">Demo data</span>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/slots.js"></script>
<script src="js/community.js"></script>
<script src="js/morph.js"></script>
<script src="js/risk.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
